trigger:
  branches:
    include:
      - main

variables:
  UV_VERSION: "0.12.6"
  UV_CACHE_DIR: $(Pipeline.Workspace)/.uv-cache

jobs:
  - job: Checks
    displayName: Format, lint, types, import contracts, tests
    pool:
      vmImage: ubuntu-24.04
    steps:
      - checkout: self
        fetchDepth: 1

      - task: Cache@2
        displayName: Cache uv
        inputs:
          key: 'uv | "$(Agent.OS)" | uv.lock'
          restoreKeys: |
            uv | "$(Agent.OS)"
          path: $(UV_CACHE_DIR)

      - bash: |
          set -euo pipefail
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "##vso[task.prependpath]$HOME/.local/bin"
        displayName: Install uv

      - bash: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui \
            fonts-noto-cjk
        displayName: Install LibreOffice for page rendering (ADR-023)

      - bash: |
          set -euo pipefail
          export DOCTRANSLATOR_TEST_REQUIRE_LIBREOFFICE=1
          uv sync --locked --all-packages
          uv run ruff format --check
          uv run ruff check
          uv run pyright
          uv run lint-imports
          uv run pytest
        displayName: Run checks

      - task: NodeTool@0
        inputs:
          versionSpec: "24.x"
        displayName: Install Node

      - bash: |
          set -euo pipefail
          npm ci
          npm run gen:api
          git diff --exit-code -- openapi.json src/api/schema.d.ts
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run e2e
        workingDirectory: apps/web
        displayName: Web checks and real-service browser tests

  - job: WindowsTests
    displayName: Tests on Windows
    pool:
      vmImage: windows-2025
    steps:
      - checkout: self
        fetchDepth: 1

      - task: Cache@2
        displayName: Cache uv
        inputs:
          key: 'uv | "$(Agent.OS)" | uv.lock'
          restoreKeys: |
            uv | "$(Agent.OS)"
          path: $(UV_CACHE_DIR)

      - pwsh: |
          $ErrorActionPreference = 'Stop'
          irm "https://astral.sh/uv/$env:UV_VERSION/install.ps1" | iex
          echo "##vso[task.prependpath]$HOME\.local\bin"
        displayName: Install uv

      - pwsh: |
          $ErrorActionPreference = 'Stop'
          uv sync --locked --all-packages
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run pytest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
        displayName: Run tests
