function renderPreview() {
  const f = S.files.find(x => x.id === S.previewId);
  if (!f) return;
  const kind = TYPES[f.ext].kind, unit = unitOf(f), last = f.pages.length - 1;
  const pi = Math.min(S.pvPage, last), p = f.pages[pi];
  const sample = SAMPLES.some(s => s.name === f.name);
  const pv = $('#preview');
  const miniText = pv.querySelector('.mini-say')?.textContent || '';
  const comments = p.comments.map(c => `<div class="comment">${esc(c.text)}<div class="meta ${c.status === 'done' ? 'done' : ''}">${c.status === 'done' ? `Fixed in version ${c.version} · about ${esc(c.about)}` : `<span class="dot"></span>Lenny is asking Gemma to fix ${esc(c.about)}...`}</div></div>`).join('');
  const composer = f.status === 'done'
    ? `<div class="composer"><div class="about">Commenting on <b>${BLOCK_NAMES[p.sel]}</b>. Click a box on the page to point at it.</div>
       <textarea id="c-${f.id}-${pi}" data-draft="${pi}" placeholder="What should change? For example: make the title shorter so it fits on one line">${esc(p.draft)}</textarea>
       <div class="row-actions"><button class="btn" type="button" data-send="${pi}">Ask Lenny to fix it</button></div></div>`
    : `<div class="locked">You can comment once this ${unit.toLowerCase()} is translated.</div>`;
  const origL = `Original · ${esc(f.lang)}`, transL = `Translated · ${esc(f.target)}${p.version > 1 ? ` · v${p.version}` : ''}`;
  const view = S.pvMode === 'compare'
    ? `<div class="cmp" style="--ar:${AR[kind]}; --x:${S.cmpX}%">
        <div class="pgbox orig">${pageCard(f, p, pi, 'orig')}</div>
        <div class="pgbox trans">${pageCard(f, p, pi, 'trans')}</div>
        <div class="cmp-handle" role="slider" tabindex="0" aria-label="Compare the original with the translation" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(S.cmpX)}"><span class="knob">${ico('sep')}</span></div>
        <span class="cmp-tag l">${origL}</span><span class="cmp-tag r">${transL}</span>
      </div>`
    : `<div class="sbs">
        <figure><figcaption>${origL}</figcaption><div class="pgbox">${pageCard(f, p, pi, 'orig')}</div></figure>
        <figure><figcaption>${transL}</figcaption><div class="pgbox">${pageCard(f, p, pi, 'trans')}</div></figure>
      </div>`;
  const strip = f.pages.map((q, i) => `<button class="thumb" type="button" data-goto="${i}" aria-current="${i === pi ? 'page' : 'false'}" aria-label="${unit} ${i + 1}${q.warn ? ', text doesn\'t fit' : ''}">
      <span class="pgbox">${pageCard(f, q, i, 'thumb')}</span>${unit} ${i + 1}${q.warn ? '<i class="wdot"></i>' : ''}${q.version > 1 ? `<i class="vdot">v${q.version}</i>` : ''}
    </button>`).join('');
  pv.innerHTML = `<div class="panel" role="dialog" aria-modal="true" aria-labelledby="pv-name">
    <div class="pv-head">
      <span class="tag" style="--tc:${TYPES[f.ext].tc}">${TYPES[f.ext].tag}</span>
      <div class="pv-title"><h2 id="pv-name">${esc(f.name)}</h2><span><span id="pv-status">${f.status === 'done' ? 'Translated' : `Translating · ${Math.floor(f.progress)}%`}</span> · ${esc(f.lang)} → ${esc(f.target)}${sample && f.target !== 'English' ? ' · prototype shows English text' : ''}</span></div>
      <div class="seg" role="group" aria-label="View"><button type="button" data-mode="compare" aria-pressed="${S.pvMode === 'compare'}">Compare</button><button type="button" data-mode="sbs" aria-pressed="${S.pvMode === 'sbs'}">Side by side</button></div>
      <button class="btn" type="button" data-act="download" ${f.status === 'done' ? '' : 'disabled'}>Download</button>
      <button class="ghost" type="button" data-act="close">Close</button>
    </div>
    <div class="pv-main">
      <nav class="pv-strip" aria-label="${unit}s">${strip}</nav>
      <div class="pv-stage">
        ${view}
        <div class="pv-nav">
          <button class="icon-btn" type="button" data-goto="${pi - 1}" aria-label="Previous ${unit.toLowerCase()}" ${pi === 0 ? 'disabled' : ''}>${ico('left')}</button>
          <span>${unit} ${pi + 1} of ${f.pages.length}</span>
          <button class="icon-btn" type="button" data-goto="${pi + 1}" aria-label="Next ${unit.toLowerCase()}" ${pi === last ? 'disabled' : ''}>${ico('right')}</button>
        </div>
      </div>
      <aside class="pv-notes" aria-label="Comments on ${unit.toLowerCase()} ${pi + 1}">
        <div class="pv-lenny">${lennySVG('small')}<div class="mini-say" aria-live="polite">${esc(miniText)}</div></div>
        <h3>${unit} ${pi + 1}${p.version > 1 ? ` <span class="ver">v${p.version}</span>` : ''}</h3>
        <div class="discuss">${comments}${composer}</div>
      </aside>
    </div>
  </div>`;
  fitStage();
  track(px, py);
}
// Size the page to the space available, like a PDF viewer's "fit page".
function fitStage() {
  const st = $('#preview .pv-stage'), f = S.files.find(x => x.id === S.previewId);
  if (!st || !f) return;
  const ar = AR[TYPES[f.ext].kind], narrow = matchMedia('(max-width: 899px)').matches;
  const W = st.clientWidth - (narrow ? 24 : 48), H = (narrow ? innerHeight * .5 : st.clientHeight - 48) - 46;
  if (S.pvMode === 'compare') {
    st.querySelector('.cmp').style.width = Math.max(160, Math.min(W, H * ar)) + 'px';
  } else {
    const w = Math.max(110, Math.min((W - 20) / 2, (H - 26) * ar));
    st.querySelectorAll('.sbs .pgbox').forEach(b => { b.style.width = w + 'px'; });
  }
}
addEventListener('resize', () => { if (S.previewId) fitStage(); });
function goPage(i) {
  const f = S.files.find(x => x.id === S.previewId);
  if (!f) return;
  const n = Math.max(0, Math.min(f.pages.length - 1, i));
  if (n === S.pvPage) return;
  S.pvPage = n;
  renderPreview();
  $('#preview .thumb[aria-current="page"]')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
function setCompare(x) {
  S.cmpX = Math.max(0, Math.min(100, x));
  const c = $('#preview .cmp');
  if (!c) return;
  c.style.setProperty('--x', S.cmpX + '%');
  c.querySelector('.cmp-handle').setAttribute('aria-valuenow', Math.round(S.cmpX));
}
function miniSay(text) {
  const m = $('#preview .mini-say');
  if (m) m.textContent = text;
  cheer($('#preview .lenny'));
}
function miniOpen(f) {
  const warns = f.pages.filter(p => p.warn).length;
  if (f.status !== 'done') miniSay(`Still chewing on this one. You can look at the original while you wait.`);
  else if (warns) miniSay(`Here it is! I marked ${warns} spot${warns > 1 ? 's' : ''} where the text didn't fit. Click a box and tell me what to change.`);
  else miniSay('Here it is! Click any box on the right if you want me to change something.');
}
function openPreview(id) {
  S.previewId = id;
  const pf = S.files.find(x => x.id === id);
  S.pvPage = Math.max(0, pf.pages.findIndex(q => q.warn));
  S.pvMode = S.pvMode || 'compare';
  S.cmpX = S.cmpX ?? 50;
  if (pf.status === 'done' && !pf.openedAt) { pf.openedAt = Date.now(); saveJobs(); }
  const pv = $('#preview');
  pv.innerHTML = '';
  pv.hidden = false;
  renderPreview();
  miniOpen(S.files.find(x => x.id === id));
  pv.querySelector('[data-act="close"]').focus();
}
function closePreview() {
  const id = S.previewId;
  S.previewId = null;
  $('#preview').hidden = true;
  $('#preview').innerHTML = '';
  S.files.find(x => x.id === id)?.el?.querySelector('.bopen')?.focus();
}
function sendComment(pi) {
  const f = S.files.find(x => x.id === S.previewId);
  const p = f.pages[pi];
  const text = p.draft.trim();
  if (!text) { miniSay('Tell me what to change first, then I\'ll get on it.'); document.getElementById(`c-${f.id}-${pi}`)?.focus(); return; }
  const c = { text, about: BLOCK_NAMES[p.sel], block: p.sel, status: 'working' };
  p.comments.push(c); p.draft = '';
  renderPreview();
  const unit = TYPES[f.ext].kind === 'slide' ? 'slide' : 'page';
  miniSay(`Om nom, feedback! Asking Gemma to fix ${unit} ${pi + 1}...`);
  setTimeout(() => {
    p.version++;
    c.status = 'done'; c.version = p.version;
    if (p.warn && (c.block === p.warn || c.block === 'page')) p.warn = null;
    renderBubble(f);
    if (S.previewId === f.id) { renderPreview(); miniSay(`${unit[0].toUpperCase() + unit.slice(1)} ${pi + 1} is fixed. Take a look!`); }
  }, RM ? 600 : 2600);
}

/* ---------- Events ---------- */
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600);
}
function lennySide() { const r = $('#lennyBtn').getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.bottom + 40 }; }

document.addEventListener('click', e => {
  if ((!menu.hidden || !umenu.hidden) && !e.target.closest('#lmenu, #lennyBtn, #umenu, #uchip')) closeMenu(false);
  if (e.target.closest('#uchip')) { const open = umenu.hidden; closeMenu(false); if (open) openUMenu(); return; }
  if (e.target.closest('.mi')) closeMenu(false);
  if (e.target.id === 'preview') return closePreview();
  const t = e.target.closest('[data-act],[data-target],[data-send],[data-block],[data-goto],[data-mode],[data-open],[data-clear],#lennyBtn');
  if (!t) return;
  if (t.id === 'lennyBtn') { boop(big()); return menu.hidden ? openMenu() : closeMenu(true); }
  if (t.dataset.open) return openPreview(+t.dataset.open);
  if (t.dataset.clear) return clearBubble(S.files.find(x => x.id === +t.dataset.clear));
  if (t.dataset.target) return translate(t.dataset.target);
  if (t.dataset.send != null) return sendComment(+t.dataset.send);
  if (t.dataset.goto != null) return goPage(+t.dataset.goto);
  if (t.dataset.mode) { S.pvMode = t.dataset.mode; return renderPreview(); }
  if (t.dataset.block) {
    const f = S.files.find(x => x.id === S.previewId), p = f.pages[+t.dataset.page];
    p.sel = p.sel === t.dataset.block ? 'page' : t.dataset.block;
    renderPreview();
    document.getElementById(`c-${f.id}-${t.dataset.page}`)?.focus();
    return;
  }
  const act = t.dataset.act;
  if (act === 'pick') $('#picker').click();
  else if (act === 'samples') {
    const r = innerWidth < 760 ? { x: innerWidth / 2, y: innerHeight - 40 } : { x: 120, y: innerHeight - 80 };
    feed(SAMPLES.map(s => ({ name: s.name, lang: s.lang })), r);
  }
  else if (act === 'done') { if (S.set.lang) translate(S.set.lang); else askTarget(); }
  else if (act === 'ask') askTarget();
  else if (act === 'settings') openSettings();
  else if (act === 'theme') toggleTheme();
  else if (act === 'history') openHistory();
  else if (act === 'clear-done') bubbles().filter(f => f.status === 'done').forEach((f, i) => clearBubble(f, i));
  else if (act === 'skip-same') skipSame();
  else if (act === 'keep-same') translate(S.pendingTarget, true);
  else if (act === 'signout') signOut();
  else if (act === 'proto') toast('Prototype: file types come from the extension, languages are guessed from the file name or text, and translation is simulated.');
  else if (act === 'restart') startOver();
  else if (act === 'download-all') { bubbles().filter(f => f.status === 'done').forEach(f => { f.downloadedAt = Date.now(); }); saveJobs(); toast('In the real app, this downloads every finished file as one zip.'); }
  else if (act === 'back') { S.phase = 'collect'; speak(() => ({ say: 'Sure, keep them coming!', sub: 'Drop more files on me, then tell me when you\'re done.', extra: html('<div class="row-actions"><button class="btn" type="button" data-act="done">That\'s everything</button></div>') })); }
  else if (act === 'close') closePreview();
  else if (act === 'forgot') { e.preventDefault(); signSay('No worries!', 'Ask your IT admin to reset it. I\'m not allowed near passwords.'); }
  else if (act === 'sso') signSay('Almost!', 'Work account sign-in isn\'t in this prototype yet. Use any username for now.');
  else if (act === 'access') { e.preventDefault(); signSay('Hi, new friend!', 'Ask your IT admin to add you, then come back and feed me documents.'); }
  else if (act === 'home') e.preventDefault();
  else if (act === 'download') { const f = S.files.find(x => x.id === S.previewId); if (f) { f.downloadedAt = Date.now(); saveJobs(); } toast('In the real app, this downloads the translated file.'); }
});
$('#preview').addEventListener('pointerdown', e => {
  const h = e.target.closest('.cmp-handle');
  if (!h) return;
  e.preventDefault();
  const c = h.closest('.cmp'), move = ev => {
    const r = c.getBoundingClientRect();
    setCompare((ev.clientX - r.left) / r.width * 100);
  };
  h.setPointerCapture(e.pointerId);
  h.focus();
  c.classList.add('dragging');
  h.addEventListener('pointermove', move);
  h.addEventListener('pointerup', () => { h.removeEventListener('pointermove', move); c.classList.remove('dragging'); }, { once: true });
});
$('#preview').addEventListener('pointerover', e => {
  const stage = $('#preview .pv-stage');
  if (!stage) return;
  const b = e.target.closest('.pv-stage [data-block]');
  stage.querySelectorAll('.hl').forEach(n => n.classList.remove('hl'));
  if (b) stage.querySelectorAll(`[data-block="${b.dataset.block}"]`).forEach(n => n.classList.add('hl'));
});
document.addEventListener('submit', e => {
  if (e.target.dataset.act !== 'custom') return;
  e.preventDefault();
  const v = $('#customLang').value.trim();
  if (!v) { $('#customLang').focus(); $('#customLang').placeholder = 'Type a language first'; return; }
  translate(v.charAt(0).toUpperCase() + v.slice(1));
});
document.addEventListener('change', e => {
  if (!e.target.dataset.fix) return;
  const it = S.tummy.find(x => x.id === +e.target.dataset.fix);
  if (it) it.lang = e.target.value;
});
document.addEventListener('input', e => {
  if (e.target.dataset.draft == null) return;
  const f = S.files.find(x => x.id === S.previewId);
  f.pages[+e.target.dataset.draft].draft = e.target.value;
});
document.addEventListener('keydown', e => {
  if (S.previewId && e.target.closest?.('.cmp-handle')) {
    const step = e.shiftKey ? 10 : 4, k = { ArrowLeft: -step, ArrowRight: step, ArrowDown: -step, ArrowUp: step }[e.key];
    if (k) { e.preventDefault(); setCompare(S.cmpX + k); return; }
    if (e.key === 'Home' || e.key === 'End') { e.preventDefault(); setCompare(e.key === 'Home' ? 0 : 100); return; }
  }
  if (S.previewId && sheetEl.hidden && !e.target.closest?.('textarea, input, select')) {
    const d = { ArrowLeft: -1, ArrowRight: 1, PageUp: -1, PageDown: 1 }[e.key];
    if (d) { e.preventDefault(); goPage(S.pvPage + d); return; }
  }
  if (e.key !== 'Escape') return;
  if (!sheetEl.hidden) closeSettings();
  else if (!menu.hidden || !umenu.hidden) closeMenu(true);
  else if (S.previewId) closePreview();
  else if (!hist.hidden) closeHistory();
});
$('#picker').addEventListener('change', e => {
  const files = [...e.target.files];
  e.target.value = '';
  if (files.length) feed(files.map(f => ({ name: f.name, file: f })), lennySide());
});
function resetApp() {
  S.files.forEach(f => { f.el?.remove(); f.el = null; });
  Object.assign(S, { phase: 'greet', tummy: [], files: [], batch: 0, previewId: null, hq: '', hf: 'all', hconfirm: null });
  $('#preview').hidden = true;
  closeHistory();
  updateTummy();
}

/* ---------- Sign in ---------- */
$('#signLenny').innerHTML = lennySVG('big');
const signL = () => $('#signLenny .lenny');
function signSay(say, sub) {
  const b = $('#signSpeech');
  setSay(b, say, signL());
  b.querySelectorAll('.sub').forEach(n => n.remove());
  if (sub) { const p = document.createElement('p'); p.className = 'sub'; p.textContent = sub; b.append(p); }
  b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
}
const TICKLES = [['Hehe, that tickles!', 'Sign in and I\'ll show you what else I can do.'], ['Boop!', 'I\'m ready when you are.'], ['Hi hi!', 'Your username goes on the left.']];
$('#signLenny').addEventListener('click', () => {
  boop(signL());
  const [a, b] = TICKLES[Math.floor(Math.random() * TICKLES.length)];
  signSay(a, b);
});
const signIdle = () => signSay("Hi, I'm Lenny!", 'Sign in so I can start translating your documents.');
const measure = document.createElement('canvas').getContext('2d');
function lookAtCaret(input) {
  // Eyes follow the text as it is typed.
  const r = input.getBoundingClientRect(), cs = getComputedStyle(input);
  measure.font = cs.font;
  const w = measure.measureText(input.value.slice(0, input.selectionStart ?? input.value.length)).width;
  track(r.left + parseFloat(cs.paddingLeft) + Math.min(w, r.width - 30), r.top + r.height / 2);
}
$('#user').addEventListener('focus', e => { signL().classList.remove('shy'); signSay('Enter your username'); lookAtCaret(e.target); });
$('#user').addEventListener('input', e => lookAtCaret(e.target));
$('#pass').addEventListener('focus', () => { signL().classList.add('shy'); signSay('Enter your password', "Don't worry, I won't peek."); });
['user', 'pass'].forEach(id => document.getElementById(id).addEventListener('blur', () => setTimeout(() => {
  if (['user', 'pass'].includes(document.activeElement?.id) || S.user) return;
  signL().classList.remove('shy');
  signIdle();
}, 0)));
$('#signForm').addEventListener('submit', async e => {
  e.preventDefault();
  const user = $('#user').value.trim(), pass = $('#pass').value;
  if (!user) { signSay('I need your username first.'); $('#user').focus(); return; }
  if (!pass) { signSay('And your password, please.'); $('#pass').focus(); return; }
  S.user = user;
  loadJobs();
  $('#uname').textContent = user;
  $('#uavatar').textContent = initials(user);
  { const r = $('#signLenny').getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height * .35, 14); }
  $('#pass').blur(); $('#user').blur();
  signL().classList.remove('shy');
  cheer(signL());
  signSay(`Welcome, ${user}!`);
  await wait(700);
  enterApp();
});

// Lenny is one character across both screens: fly the visible instance to where the other one sits.
function flyLenny(from, to) {
  const a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
  from.style.visibility = 'hidden';
  to.style.visibility = '';
  to.style.transformOrigin = '0 0';
  to.animate([
    { transform: `translate(${a.left - b.left}px, ${a.top - b.top}px) scale(${a.width / b.width})` },
    { transform: 'none' },
  ], { duration: dur(1000), easing: 'cubic-bezier(.7, 0, .2, 1)' });
}
async function enterApp() {
  const wrap = $('#lennyWrap');
  $('#stage').hidden = false;
  $('#appActions').hidden = false;
  wrap.classList.add('arriving');
  welcome();
  document.body.classList.replace('mode-signin', 'mode-app');
  flyLenny($('#signLenny'), $('#lennyBtn'));
  await wait(1000);
  $('#signin').hidden = true;
  wrap.classList.remove('arriving');
  speak(S.speech);
  restoreBubbles();
  track(px, py);
}
async function leaveApp() {
  $('#signin').hidden = false;
  void document.body.offsetWidth;
  $('#appActions').hidden = true;
  signL().classList.remove('shy');
  signIdle();
  document.body.classList.replace('mode-app', 'mode-signin');
  flyLenny($('#lennyBtn'), $('#signLenny'));
  await wait(1000);
  $('#stage').hidden = true;
  $('#lennyBtn').style.visibility = '';
  $('#user').focus();
}
function signOut() {
  doSaveJobs();
  resetApp();
  S.user = '';
  $('#pass').value = '';
  leaveApp();
}

// Native drag and drop from the desktop.
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
let dragDepth = 0;
addEventListener('dragenter', e => {
  if (!hasFiles(e) || S.previewId || !S.user) return;
  e.preventDefault();
  if (dragDepth++ === 0) {
    S.dragging = true;
    document.body.classList.add('dragging');
    const lr = $('#lennyBtn').getBoundingClientRect();
    $('#spot').style.setProperty('--lx', (lr.left + lr.width / 2) + 'px');
    $('#spot').style.setProperty('--ly', (lr.top + lr.height / 2) + 'px');
    speak(() => ({ say: 'Ooh, is that for me? Drop it in!' }), false);
  }
});
addEventListener('dragover', e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = S.previewId || !S.user ? 'none' : 'copy';
  track(e.clientX, e.clientY);
});
function endDrag(restore) {
  dragDepth = 0; S.dragging = false;
  document.body.classList.remove('dragging');
  setOpen(big(), 0);
  if (restore && S.speech) speak(S.speech);
}
addEventListener('dragleave', e => { if (S.dragging && hasFiles(e) && --dragDepth <= 0) endDrag(true); });
addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  endDrag(false);
  if (S.previewId || !S.user) return;
  const files = [...e.dataTransfer.files];
  if (files.length) feed(files.map(f => ({ name: f.name, file: f })), { x: e.clientX, y: e.clientY });
});

signIdle();
updateEyes();
})();
</script>
