<style>

  --card-shadow: 0 1px 2px rgba(20, 45, 65, .06), 0 16px 40px -12px rgba(20, 45, 65, .28);
  --orb-bg: radial-gradient(circle at 32% 26%, rgba(255, 255, 255, .98), rgba(255, 255, 255, .62) 42%, rgba(235, 246, 252, .42) 70%, rgba(255, 255, 255, .6));
  --orb-track: rgba(20, 45, 65, .10);
  --glass: rgba(255, 255, 255, .72);
  --night: 0;
  --cloud-alpha: 1;
  --cloud-filter: brightness(1) saturate(1);
  --day-only: 1;
  --sc-bg: #FFFFFF;
  --sc-fg: #0A0A0A;
  --sc-primary: #171717;
  --sc-primary-fg: #FAFAFA;
  --sc-muted: #737373;
  --sc-border: #E5E5E5;
  --sc-input: #E5E5E5;
  --sc-ring: #A1A1A1;
  --sc-accent: #F5F5F5;
  --font: "Geist", "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, Consolas, monospace;
  --body: var(--font);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0B1018;
    --surface: #111822;
    --ink: #FAFAFA;

    --look-bg: url(assets/meadow-night.webp);
    --lenny-filter: brightness(.9) saturate(.9);
    --lenny-glow: rgba(160, 190, 255, .32);
    --shadow: rgba(0, 0, 0, .45);
    --warn: #F59E0B;
    --ok: #4CC3A2;
    --scrim: rgba(2, 6, 12, .55);
    --t-pptx: #F07A4A;
    --t-docx: #6B95F0;
    --t-xlsx: #45B676;
    --t-pdf: #EE616C;
    --t-txt: #95A3B1;
    --card: rgba(14, 20, 30, .7);
    --card-solid: rgba(14, 20, 30, .9);
    --card-border: rgba(255, 255, 255, .09);
    --card-shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 16px 40px -12px rgba(0, 0, 0, .6);
    --orb-bg: radial-gradient(circle at 32% 26%, rgba(170, 190, 235, .55), rgba(40, 52, 78, .6) 45%, rgba(16, 22, 36, .72) 75%, rgba(60, 76, 110, .6));
    --orb-track: rgba(255, 255, 255, .12);
    --glass: rgba(14, 20, 30, .7);
    --night: 1;
    --cloud-alpha: .5;
    --cloud-filter: brightness(.5) saturate(.55);
    --day-only: 0;
    --sc-bg: #0A0A0A;
    --sc-fg: #FAFAFA;
    --sc-primary: #E5E5E5;
    --sc-primary-fg: #171717;
    --sc-muted: #A1A1A1;
    --sc-border: rgba(255, 255, 255, .1);
    --sc-input: rgba(255, 255, 255, .15);
    --sc-ring: #737373;
    --sc-accent: #262626;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0B1018;
  --surface: #111822;
  --ink: #FAFAFA;
  --muted: #A1A1A1;
  --line: rgba(255, 255, 255, .1);
  --lenny-rim: #9DB6FF;
  --look-bg: url(assets/meadow-night.webp);
  --lenny-filter: brightness(.9) saturate(.9);
  --lenny-glow: rgba(160, 190, 255, .32);
  --shadow: rgba(0, 0, 0, .45);
  --warn: #F59E0B;
  --ok: #4CC3A2;
  --scrim: rgba(2, 6, 12, .55);
  --t-pptx: #F07A4A;
  --t-docx: #6B95F0;
  --t-xlsx: #45B676;
  --t-pdf: #EE616C;
  --t-txt: #95A3B1;
  --card: rgba(14, 20, 30, .7);
  --card-solid: rgba(14, 20, 30, .9);
  --card-border: rgba(255, 255, 255, .09);
  --card-shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 16px 40px -12px rgba(0, 0, 0, .6);
  --orb-bg: radial-gradient(circle at 32% 26%, rgba(170, 190, 235, .55), rgba(40, 52, 78, .6) 45%, rgba(16, 22, 36, .72) 75%, rgba(60, 76, 110, .6));
  --orb-track: rgba(255, 255, 255, .12);
  --glass: rgba(14, 20, 30, .7);
  --night: 1;
  --cloud-alpha: .5;

  --day-only: 0;
  --sc-bg: #0A0A0A;
  --sc-fg: #FAFAFA;
  --sc-primary: #E5E5E5;
  --sc-primary-fg: #171717;
  --sc-muted: #A1A1A1;
  --sc-border: rgba(255, 255, 255, .1);
  --sc-input: rgba(255, 255, 255, .15);
  --sc-ring: #737373;
  --sc-accent: #262626;
}

html, body { height: 100%; overflow: hidden; }
body {
  height: 100dvh; overscroll-behavior: none;
  background: var(--ground); color: var(--ink);
  font: 400 14px/1.5 var(--font); -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; padding-inline: 16px;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sc-ring); outline-offset: 2px; }

/* Shape rule: controls 8px, cards 16px, orbs and Lenny round. */
.frost {
  background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--card-shadow);
  backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
}

header.top {
  position: relative; z-index: 10; width: min(1120px, 100%); margin: 14px auto 0;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 8px 8px 8px 12px; border-radius: 14px;
  background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--card-shadow);
  backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  transition: opacity .5s ease .45s;
}
body.mode-signin header.top { opacity: 0; pointer-events: none; transition-delay: 0s; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
.brand small { color: var(--muted); font-weight: 400; font-size: 13px; }

/* Buttons used across the app (shadcn sizes: default 36px, small 32px). */
.btn, .ghost, .chip {
  height: 32px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 0 12px; border-radius: 8px; border: 1px solid transparent;
  font: 500 13px/1 var(--font); white-space: nowrap;
  transition: background .15s, border-color .15s, transform .1s;
}
.btn { background: var(--sc-primary); color: var(--sc-primary-fg); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.btn:hover { background: color-mix(in srgb, var(--sc-primary) 88%, transparent); }
.btn.alt, .ghost, .chip { background: var(--sc-bg); color: var(--sc-fg); border-color: var(--sc-border); box-shadow: 0 1px 2px rgba(0, 0, 0, .05); }
.btn.alt:hover, .ghost:hover, .chip:hover { background: var(--sc-accent); }
.btn:active, .ghost:active, .chip:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

#stage {
  position: relative; z-index: 1; flex: 1; min-height: 0;
  display: flex; flex-direction: column; align-items: center;
  padding-top: clamp(190px, 33vh, 300px); padding-bottom: clamp(16px, 5vh, 48px);
}
.lenny-wrap { position: relative; margin-block: auto; display: flex; flex-direction: column; align-items: center; z-index: 3; }
#lennyBtn { background: none; border: 0; padding: 0; border-radius: 50%; }
#lennyBtn::before {
  content: ""; position: absolute; inset: 4% 0 0; border-radius: 50%;
  border: 2px dashed rgba(255, 255, 255, .9); opacity: 0; transform: scale(.9);
  transition: opacity .25s, transform .25s;
}
body.dragging #lennyBtn::before { opacity: .8; transform: scale(1.1); animation: spin 16s linear infinite; }
@keyframes spin { to { transform: scale(1.1) rotate(360deg); } }
.lenny { filter: var(--lenny-filter); }
.lenny.big { width: clamp(150px, min(22vw, 30vh), 280px); height: auto; display: block; overflow: visible; }
#tummy {
  margin-top: 6px; font: 500 12px/1 var(--font); font-variant-numeric: tabular-nums;
  color: var(--sc-primary-fg); background: var(--sc-primary); border-radius: 6px; padding: 5px 8px;
}
.hint {
  margin-top: 10px; font-size: 12.5px; color: var(--ink); padding: 4px 10px; border-radius: 999px;
  background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}

/* Lenny: rig (lean, driven by JS) > body (squash and stretch, CSS) > face (gaze, JS). */
.lenny .l-body { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 4s ease-in-out infinite; }
.lenny .l-sprout { transform-box: fill-box; transform-origin: 15% 100%; animation: sway 4.6s ease-in-out infinite; }
.lenny .l-shadow { transform-box: fill-box; transform-origin: 50% 50%; }
.lenny .l-lid { transform-box: fill-box; transform-origin: 50% 50%; }
.lenny .l-eyes-happy, .lenny .l-eyes-closed { opacity: 0; transition: opacity .12s; }
.lenny .l-eyes-open { transition: opacity .12s; }
.lenny.happy .l-eyes-open, .lenny.shy .l-eyes-open { opacity: 0; }
.lenny.happy .l-eyes-happy { opacity: 1; }
.lenny.shy:not(.happy) .l-eyes-closed { opacity: 1; }
.lenny.blink .l-lid { animation: blink .16s ease-in-out; }
.lenny .l-open { transform-box: fill-box; transform-origin: 50% 35%; transform: scale(var(--open, 0)); transition: transform .18s cubic-bezier(.3, 1.4, .5, 1); }
.lenny .l-smile { opacity: calc(1 - var(--open, 0) * 5); }
.lenny .l-bulge { opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; }
.lenny.gulp .l-bulge { animation: bulge .55s ease-in; }
.lenny.chew .l-body { animation: chew .22s ease-in-out 6 alternate; }
.lenny.hop .l-body { animation: hop .5s cubic-bezier(.3, .7, .4, 1) 2; }
.lenny.hop .l-shadow { animation: shadowhop .5s cubic-bezier(.3, .7, .4, 1) 2; }
.lenny.gulp .l-body { animation: gulp .45s ease-in-out; }
@keyframes breathe { 50% { transform: translateY(-1.5%) scale(1.02, .985); } }
@keyframes sway { 50% { transform: rotate(8deg); } }
@keyframes blink { 50% { transform: scaleY(.08); } }
@keyframes chew { from { transform: scale(1.06, .93); } to { transform: scale(.97, 1.04); } }
@keyframes hop { 30% { transform: scale(1.08, .9); } 55% { transform: translateY(-16%) scale(.95, 1.06); } 85% { transform: translateY(0) scale(1.06, .94); } }
@keyframes shadowhop { 55% { transform: scale(.72); opacity: .5; } }
@keyframes gulp { 40% { transform: scale(1.1, .9); } 70% { transform: scale(.97, 1.04); } }
@keyframes bulge { 0% { opacity: .5; transform: translateY(-18px) scale(.8); } 100% { opacity: 0; transform: translateY(36px) scale(1.4); } }

/* Speech */
.speech {
  position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%);
  width: min(420px, calc(100vw - 32px)); padding: 16px; border-radius: 16px; z-index: 4;
  background: var(--card-solid); border: 1px solid var(--card-border); box-shadow: var(--card-shadow);
  backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  color: var(--ink);
}
.speech::after {
  content: ""; position: absolute; left: 50%; bottom: -7px; width: 14px; height: 14px;
  background: var(--card-solid); border-right: 1px solid var(--card-border); border-bottom: 1px solid var(--card-border);
  transform: translateX(-50%) rotate(45deg); border-bottom-right-radius: 3px;
}
.speech.pop { animation: pop .32s cubic-bezier(.3, 1.45, .5, 1); }
@keyframes pop { from { transform: translateX(-50%) translateY(6px) scale(.94); opacity: .3; } }
.say { margin: 0; font-weight: 600; font-size: 16px; line-height: 1.4; letter-spacing: -.01em; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
.extra:empty { display: none; }
.extra { margin-top: 14px; display: flex; flex-direction: column; gap: 12px; max-height: max(120px, calc(33vh - 90px)); overflow-y: auto; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row-actions .sub { margin: 0; }
.files { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 190px; overflow: auto; }
.files li { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-size: 13.5px; }
.fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag {
  font: 600 10.5px/1 var(--mono); letter-spacing: .02em; color: var(--tc, var(--t-txt));
  background: color-mix(in srgb, var(--tc, var(--t-txt)) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--tc, var(--t-txt)) 28%, transparent); border-radius: 6px; padding: 4px 6px;
}
.files select, .custom input {
  height: 28px; border: 1px solid var(--sc-input); border-radius: 8px; background: var(--sc-bg); padding: 0 8px; font-size: 13px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
}
.custom input { height: 32px; flex: 1; min-width: 0; padding: 0 10px; }
.files select:focus-visible, .custom input:focus-visible { outline: none; border-color: var(--sc-ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--sc-ring) 45%, transparent); }
.rejected { color: var(--muted); font-size: 13px; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.custom { display: flex; gap: 8px; }

/* File bubbles: glass orbs with a thin progress ring. */
#bubbles { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.bubble {
  position: absolute; width: 140px; pointer-events: auto; background: none; border: 0; padding: 0;
  display: flex; flex-direction: column; align-items: center; text-align: center;
}
.bubble .float { display: flex; flex-direction: column; align-items: center; gap: 8px; animation: float 6s ease-in-out infinite; animation-delay: var(--fd, 0s); }
@keyframes float { 50% { transform: translateY(-8px); } }
.orb {
  position: relative; width: 88px; height: 88px; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  background: var(--orb-bg); border: 1px solid var(--card-border);
  backdrop-filter: blur(12px) saturate(170%); -webkit-backdrop-filter: blur(12px) saturate(170%);
  box-shadow: inset 0 -10px 18px rgba(70, 130, 165, .16), inset 0 8px 14px rgba(255, 255, 255, .55), 0 18px 34px -14px rgba(15, 40, 60, .45);
  transition: transform .3s cubic-bezier(.3, 1.4, .5, 1);
}
.bubble:hover .orb, .bubble:focus-visible .orb { transform: scale(1.08); }
.bubble:focus-visible { outline: none; }
.bubble:focus-visible .orb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--sc-ring) 60%, transparent), 0 18px 34px -14px rgba(15, 40, 60, .45); }
.prog { position: absolute; inset: -7px; width: calc(100% + 14px); height: calc(100% + 14px); transform: rotate(-90deg); pointer-events: none; }
.prog .trk { fill: none; stroke: var(--orb-track); stroke-width: 2.5; }
.prog .bar { fill: none; stroke: var(--lenny-deep); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset .4s ease; }
.ficon {
  position: relative; width: 24px; height: 30px; border-radius: 3px 8px 3px 3px;
  background: linear-gradient(#FFFFFF, #EEF2F6); box-shadow: 0 1px 2px rgba(15, 30, 45, .25), 0 0 0 .5px rgba(15, 30, 45, .15);
}
.ficon::before { content: ""; position: absolute; top: 0; right: 0; width: 8px; height: 8px; border-radius: 0 8px 0 2px; background: linear-gradient(225deg, transparent 50%, #D5DDE5 50%); }
.ficon b {
  position: absolute; left: -5px; right: -5px; bottom: 5px; height: 10px; border-radius: 2px;
  background: var(--tc); color: #fff; font: 700 6.5px/10px var(--mono); letter-spacing: .04em; text-align: center;
}
.orb .pct { font: 600 11px/1 var(--font); font-variant-numeric: tabular-nums; color: var(--ink); opacity: .75; }
.badge {
  position: absolute; top: -4px; right: -4px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px;
  display: grid; place-items: center; font: 600 11.5px/1 var(--font); color: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .2);
}
.badge.ok { background: var(--ok); }
.badge.warn { background: var(--warn); }
.blabel {
  display: flex; flex-direction: column; align-items: center; gap: 1px; max-width: 140px; padding: 5px 10px 6px; border-radius: 10px;
  background: var(--glass); border: 1px solid var(--card-border); backdrop-filter: blur(12px) saturate(150%); -webkit-backdrop-filter: blur(12px) saturate(150%);
  box-shadow: 0 6px 16px -8px rgba(15, 40, 60, .35);
}
.bname { max-width: 120px; font-size: 12.5px; font-weight: 500; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bstat { font-size: 11px; color: var(--muted); white-space: nowrap; }

.flycard {
  position: fixed; z-index: 50; pointer-events: none; display: flex; gap: 8px; align-items: center;
  padding: 8px 12px; border-radius: 12px; max-width: 220px; white-space: nowrap; font-weight: 500; font-size: 13px;
  background: var(--card-solid); border: 1px solid var(--card-border); box-shadow: var(--card-shadow);
}
.flycard span:last-child { overflow: hidden; text-overflow: ellipsis; }

footer.note { position: relative; z-index: 1; padding-block: 6px 14px; text-align: center; }
body.mode-signin footer.note { visibility: hidden; }
footer.note span {
  display: inline-block; padding: 4px 12px; border-radius: 999px; color: var(--ink); opacity: .85; font-size: 12px;
  background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}

/* Preview: a shadcn dialog. */
#preview { position: fixed; inset: 0; z-index: 60; display: flex; padding: 16px; background: var(--scrim); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.panel {
  position: relative; margin: auto; width: min(1100px, 100%); height: min(860px, 100%);
  display: flex; flex-direction: column; overflow: hidden; border-radius: 16px;
  background: var(--sc-bg); color: var(--sc-fg); border: 1px solid var(--sc-border); box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .45);
  animation: rise .28s cubic-bezier(.2, .9, .3, 1);
}
@keyframes rise { from { opacity: 0; transform: translateY(12px) scale(.985); } }
.pv-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 20px; border-bottom: 1px solid var(--sc-border); }
.pv-title { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.pv-title h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pv-title span { color: var(--sc-muted); font-size: 13px; }
.pv-body { flex: 1; overflow: auto; padding: 20px 20px 160px; display: flex; flex-direction: column; gap: 32px; }
.pv-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.pv-label { font-size: 12.5px; font-weight: 500; color: var(--sc-muted); margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
.ver { font: 500 11px/1 var(--font); background: var(--sc-accent); color: var(--sc-fg); border: 1px solid var(--sc-border); border-radius: 6px; padding: 3px 6px; }
.pv-row h3 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
.page {
  background: #fff; color: #1D2733; border-radius: 8px; border: 1px solid var(--sc-border);
  padding: 7% 8%; display: flex; flex-direction: column; gap: 9px; position: relative; box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
}
.page.slide { aspect-ratio: 16 / 9; }
.page.doc { aspect-ratio: 4 / 3.2; }
.page.sheet { aspect-ratio: 16 / 10; }
.blk { text-align: left; background: none; border: 1.5px solid transparent; border-radius: 6px; padding: 3px 5px; margin: -5px; display: block; width: 100%; color: inherit; }
button.blk:hover { border-color: #9FD9C8; background: rgba(114, 208, 182, .1); }
button.blk.sel { border-color: #2F9C82; background: rgba(114, 208, 182, .16); }
.blk.title { font-weight: 700; font-size: clamp(13px, 1.6vw, 19px); line-height: 1.25; letter-spacing: -.01em; }
.bar { height: 7px; border-radius: 4px; background: #E3E8EE; }
.blk.warn { border: 1.5px dashed #D97706; position: relative; }
.blk.warn .bar { background: #F7D3A6; }
.blk.warn .bar:first-child { width: 118% !important; }
.blk.warn::after {
  content: "Text doesn't fit"; position: absolute; right: 4px; top: -10px; background: #D97706; color: #fff;
  font: 600 10px/1 var(--font); padding: 3px 6px; border-radius: 5px;
}
.cells { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.cells i { height: 11px; border-radius: 3px; background: #EBEFF3; }
.pending { display: grid; place-items: center; color: #737373; font-weight: 500; font-size: 13px; background: repeating-linear-gradient(-45deg, #F7F8FA 0 12px, #F0F2F5 12px 24px); }
.discuss { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.comment { border: 1px solid var(--sc-border); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; }
.comment .meta { font-size: 12px; color: var(--sc-muted); margin-top: 4px; display: flex; gap: 6px; align-items: center; }
.comment .meta.done { color: var(--ok); font-weight: 500; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lenny-deep); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.composer { display: flex; flex-direction: column; gap: 8px; }
.composer .about { font-size: 12.5px; color: var(--sc-muted); }
.composer .about b { color: var(--sc-fg); font-weight: 500; }
.composer textarea {
  width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--sc-input); border-radius: 8px; padding: 8px 12px;
  background: transparent; font-size: 13.5px; box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
}
.composer textarea:focus-visible { outline: none; border-color: var(--sc-ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--sc-ring) 45%, transparent); }
.composer .row-actions { justify-content: flex-end; }
.locked { color: var(--sc-muted); font-size: 13px; }
.mini { position: absolute; right: 16px; bottom: 12px; display: flex; align-items: flex-end; gap: 6px; pointer-events: none; max-width: calc(100% - 32px); }
.mini .lenny { width: 96px; height: auto; flex: none; overflow: visible; }
.mini-say {
  padding: 10px 14px; border-radius: 14px 14px 4px 14px; max-width: 320px; margin-bottom: 46px;
  font-weight: 500; font-size: 13.5px; line-height: 1.45; color: var(--ink);
  background: var(--card-solid); border: 1px solid var(--sc-border); box-shadow: var(--card-shadow);
}

#toast {
  position: fixed; right: 24px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 80; max-width: min(360px, calc(100vw - 48px));
  padding: 12px 16px; border-radius: 10px; font-weight: 500; font-size: 13.5px;
  background: var(--sc-bg); color: var(--sc-fg); border: 1px solid var(--sc-border); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .3);
  animation: rise .25s cubic-bezier(.2, .9, .3, 1);
}

@media (max-width: 759px) {
  #stage { padding-top: 12px; padding-bottom: 168px; gap: 0; }
  .lenny-wrap { margin-block: 0 auto; }
  .lenny.big { width: clamp(110px, min(34vw, 20vh), 170px); }
  .speech { position: static; transform: none; width: min(420px, 100%); margin-bottom: 12px; }
  .speech::after { display: none; }
  .speech.pop { animation: none; }
  .extra { max-height: 26vh; }
  #bubbles {
    position: absolute; inset: auto 0 6px; display: flex; gap: 4px; justify-content: safe center;
    overflow-x: auto; padding: 10px 8px 8px; scroll-snap-type: x proximity; scrollbar-width: none;
  }
  .bubble { position: relative; left: auto !important; top: auto !important; width: 112px; flex: none; scroll-snap-align: center; }
  .blabel { max-width: 108px; padding-inline: 8px; }
  .bname { max-width: 92px; }
  .sc-form { gap: 18px; }
  footer.note { display: none; }
  .pv-cols { grid-template-columns: 1fr; }
  .mini .lenny { width: 66px; }
  .mini-say { font-size: 13px; margin-bottom: 30px; }
  .brand small { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .lenny .l-body, .lenny .l-sprout, .bubble .float, body.dragging #lennyBtn::before, .panel, #toast { animation: none !important; }
  .speech.pop { animation: none; }
}

/* World: always a full-screen scene. On the sign-in page it is clipped to a card, so opening
   the clip reads as the picture being uncropped. A generated image can replace the SVG as-is. */
#world { position: fixed; inset: 0; z-index: 0; overflow: hidden; clip-path: inset(0 0 0 0 round 0); transition: clip-path 1s cubic-bezier(.7, 0, .2, 1); }
.w-ground { position: absolute; inset: -24px; }
.w-scene { position: absolute; inset: 0; }
.w-scene img {
  position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  object-fit: cover; object-position: 50% 62%;
}
.w-night { opacity: var(--night); transition: opacity 1.2s ease; }
.w-clouds {
  position: absolute; inset: 0; pointer-events: none;
  -webkit-mask-image: linear-gradient(to bottom, #000 var(--fade-start, 30%), transparent var(--fade-end, 40%));
  mask-image: linear-gradient(to bottom, #000 var(--fade-start, 30%), transparent var(--fade-end, 40%));
}
.w-clouds img {
  position: absolute; left: 0; top: 0; will-change: transform;
  opacity: calc(var(--o) * var(--cloud-alpha)); filter: var(--cloud-filter);
  transition: opacity 1.2s ease, filter 1.2s ease;
}
.w-clouds img.day-only { opacity: calc(var(--o) * var(--cloud-alpha) * var(--day-only)); }

/* Soft glow behind Lenny so it separates from the grass. */
#lennyBtn, #signLenny { position: relative; isolation: isolate; }
#lennyBtn::after, #signLenny::after {
  content: ""; position: absolute; inset: -4% -16% 2%; border-radius: 50%; z-index: -1; pointer-events: none;
  background: radial-gradient(closest-side, var(--lenny-glow), transparent);
  animation: glow 4.5s ease-in-out infinite;
}
@keyframes glow { 50% { opacity: .55; transform: scale(.93); } }


:root { --card-clip: inset(0 0 0 50% round 0); }
body.mode-signin #world { clip-path: var(--card-clip); }

#signin { position: fixed; inset: 0; z-index: 5; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 100%; overflow: hidden; }
.sign-card { display: flex; align-items: center; justify-content: center; padding: 150px 40px 40px; }
.sign-card .lenny-wrap { margin-block: 0; }
#signLenny .lenny.big { width: clamp(180px, 19vw, 240px); }
#signin .speech { transition: opacity .3s; }
body.mode-app #signin { pointer-events: none; }
body.mode-app #signin .speech { opacity: 0; }
.lenny .l-lid { transition: transform .18s ease-out; }
.lenny.shy .l-lid { transform: scaleY(.08); }

/* Form panel: shadcn login-02 (new-york-v4), tokens --sc-*. */
.signpanel {
  display: flex; flex-direction: column; gap: 16px; padding: 40px; overflow-y: auto; min-height: 0;
  background: var(--sc-bg); color: var(--sc-fg); font-family: "Geist", var(--body);
  transition: transform 1s cubic-bezier(.7, 0, .2, 1), opacity .9s ease-in;
}
body.mode-app .signpanel { transform: translateX(calc(-100% - 80px)); opacity: 0; }
.signpanel :focus-visible { outline: none; }
.sc-brand { display: flex; align-items: center; gap: 8px; align-self: flex-start; font-size: 14px; font-weight: 500; color: inherit; text-decoration: none; }
.sc-logo { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--sc-primary); color: var(--sc-primary-fg); }
.sc-logo svg { width: 16px; height: 16px; }
.sc-center { flex: 1; display: flex; align-items: center; justify-content: center; }
.sc-form { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 28px; }
.sc-head { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.sc-head h1 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 700; letter-spacing: -.015em; }
.sc-head p { margin: 0; font-size: 14px; line-height: 20px; color: var(--sc-muted); text-wrap: balance; }
.sc-field { display: flex; flex-direction: column; gap: 12px; }
.sc-field label { font-size: 14px; font-weight: 500; line-height: 1.375; }
.sc-row { display: flex; align-items: center; }
.sc-row a { margin-left: auto; font-size: 14px; color: inherit; text-decoration: none; text-underline-offset: 4px; }
.sc-row a:hover, .sc-row a:focus-visible { text-decoration: underline; }
.sc-form input {
  height: 36px; width: 100%; padding: 4px 12px; border: 1px solid var(--sc-input); border-radius: 8px;
  background: transparent; color: inherit; font: 400 14px/20px "Geist", var(--body);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .05); transition: border-color .15s, box-shadow .15s;
}
.sc-form input::placeholder { color: var(--sc-muted); }
.sc-form input:focus-visible { border-color: var(--sc-ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--sc-ring) 50%, transparent); }
.sc-btn {
  height: 36px; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid transparent; border-radius: 8px; background: var(--sc-primary); color: var(--sc-primary-fg);
  font: 500 14px/1 "Geist", var(--body); box-shadow: 0 1px 2px rgba(0, 0, 0, .05); transition: background .15s, box-shadow .15s;
}
.sc-btn:hover { background: color-mix(in srgb, var(--sc-primary) 90%, transparent); }
.sc-btn:focus-visible { box-shadow: 0 0 0 3px color-mix(in srgb, var(--sc-ring) 50%, transparent); }
.sc-btn svg { width: 16px; height: 16px; flex: none; }
.sc-outline { background: var(--sc-bg); color: var(--sc-fg); border-color: var(--sc-border); }
.sc-outline:hover { background: var(--sc-accent); }
.sc-sep { position: relative; height: 20px; margin-block: -8px; text-align: center; font-size: 14px; line-height: 20px; color: var(--sc-muted); }
.sc-sep::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--sc-border); }
.sc-sep span { position: relative; padding: 0 8px; background: var(--sc-bg); }
.sc-desc { margin: 0; text-align: center; font-size: 14px; line-height: 20px; color: var(--sc-muted); }
.sc-desc a { color: inherit; text-decoration: underline; text-underline-offset: 4px; }
.sc-desc a:hover { color: var(--sc-fg); }
.sc-note { margin: 0; text-align: center; font-size: 12px; color: var(--sc-muted); }
.actions { display: flex; gap: 8px; }

.lenny-wrap.arriving .speech, .lenny-wrap.arriving .hint, .lenny-wrap.arriving #tummy { visibility: hidden; }
#signLenny .lenny { filter: var(--lenny-filter); }
.sc-sm { height: 32px; width: auto; padding: 0 12px; font-size: 13px; }

@media (max-width: 759px) {
  :root { --card-clip: inset(0 0 64% 0 round 0); }
  #signin { grid-template-columns: 1fr; grid-template-rows: 36% minmax(0, 1fr); }
  .sign-card { order: -1; padding: 16px; align-items: flex-end; }
  #signLenny .lenny.big { width: min(130px, 16vh); }
  .signpanel { padding: 24px; }
  .sc-brand { align-self: center; }
  body.mode-app .signpanel { transform: translateY(110%); }
}
@media (prefers-reduced-motion: reduce) {
  #world, .signpanel { transition-duration: .01s; }
  #lennyBtn::after, #signLenny::after { animation: none; }
}

/* Boop: clicking Lenny squashes him and he bounces back. */
.lenny.boop .l-body { animation: boop .52s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes boop { 0% { transform: scale(1.14, .82); } 45% { transform: scale(.94, 1.08); } 75% { transform: scale(1.03, .98); } }
body.no-sprout .lenny .l-sprout { display: none; }
#signLenny { cursor: pointer; }

/* Lenny's menu: a shadcn dropdown menu. */
.lmenu {
  position: fixed; z-index: 65; min-width: 236px; padding: 4px; border-radius: 12px;
  background: var(--sc-bg); color: var(--sc-fg); border: 1px solid var(--sc-border);
  box-shadow: 0 16px 40px -12px rgba(0, 0, 0, .35); transform-origin: var(--origin, left top);
  animation: menuIn .2s cubic-bezier(.2, .9, .3, 1.2);
}
@keyframes menuIn { from { opacity: 0; transform: scale(.92); } }
.m-head { padding: 8px 10px 6px; }
.m-head b { display: block; font-size: 13.5px; font-weight: 600; }
.m-head span { display: block; font-size: 12.5px; color: var(--sc-muted); }
.lmenu hr { border: 0; border-top: 1px solid var(--sc-border); margin: 4px -4px; }
.mi {
  width: 100%; height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 10px;
  border: 0; border-radius: 8px; background: transparent; color: inherit; font: 400 13.5px/1 var(--font); text-align: left;
}
.mi svg { width: 16px; height: 16px; flex: none; color: var(--sc-muted); }
.mi:hover, .mi:focus-visible { background: var(--sc-accent); outline: none; }

/* Settings: a shadcn dialog. */
#settings { position: fixed; inset: 0; z-index: 70; display: flex; padding: 16px; background: var(--scrim); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.sheet {
  margin: auto; width: min(540px, 100%); max-height: 100%; overflow-y: auto; display: flex; flex-direction: column;
  border-radius: 16px; background: var(--sc-bg); color: var(--sc-fg); border: 1px solid var(--sc-border);
  box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .45); animation: rise .28s cubic-bezier(.2, .9, .3, 1);
}
.sheet-head { padding: 22px 24px 0; }
.sheet-head h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.sheet-head p { margin: 4px 0 0; font-size: 13.5px; color: var(--sc-muted); }
.sheet-body { padding: 18px 24px 8px; display: flex; flex-direction: column; gap: 22px; }
.set-group h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; }
.look { display: grid; grid-template-columns: 140px 1fr; gap: 20px; align-items: center; }
.look-stage {
  height: 150px; border-radius: 12px; border: 1px solid var(--sc-border); overflow: hidden;
  display: grid; place-items: center; background: var(--look-bg) center 72% / cover;
}
.look-stage .lenny { width: 96px; height: auto; overflow: visible; }
.look-ctl { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.sw { position: relative; cursor: pointer; }
.sw input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.sw span { display: block; width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0, var(--c) 45%, color-mix(in srgb, var(--c) 70%, #000) 100%); box-shadow: 0 0 0 1px rgba(0, 0, 0, .08); transition: box-shadow .15s; }
.sw input:checked + span { box-shadow: 0 0 0 2px var(--sc-bg), 0 0 0 4px var(--sc-fg); }
.sw input:focus-visible + span { box-shadow: 0 0 0 2px var(--sc-bg), 0 0 0 4px var(--sc-ring); }
.hue-l { font-size: 12.5px; color: var(--sc-muted); margin-bottom: -6px; }
.hue {
  width: 100%; height: 10px; margin: 0; border-radius: 999px; -webkit-appearance: none; appearance: none; cursor: pointer;
  background: linear-gradient(to right, hsl(0 55% 62%), hsl(60 55% 62%), hsl(120 55% 62%), hsl(180 55% 62%), hsl(240 55% 62%), hsl(300 55% 62%), hsl(359 55% 62%));
}
.hue::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid var(--sc-primary); box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
.hue::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2px solid var(--sc-primary); }
.hue:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--sc-ring) 50%, transparent); }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid var(--sc-border); }
.set-group h3 + .set-row { border-top: 0; padding-top: 0; }
.set-row.compact { padding: 0; border: 0; }
.set-row b { display: block; font-size: 13.5px; font-weight: 500; }
.set-row span { display: block; font-size: 12.5px; color: var(--sc-muted); margin-top: 2px; }
.switch {
  position: relative; flex: none; width: 36px; height: 20px; padding: 0; border: 0; border-radius: 999px;
  background: var(--sc-input); transition: background .15s;
}
.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .18s cubic-bezier(.3, 1.3, .5, 1);
}
.switch[aria-checked="true"] { background: var(--sc-primary); }
.switch[aria-checked="true"]::after { transform: translateX(16px); background: var(--sc-primary-fg); }
.switch:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--sc-ring) 50%, transparent); }
.sc-select {
  height: 36px; min-width: 180px; padding: 0 10px; border: 1px solid var(--sc-input); border-radius: 8px;
  background: var(--sc-bg); color: var(--sc-fg); font-size: 13.5px; box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
}
.sc-select:focus-visible { outline: none; border-color: var(--sc-ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--sc-ring) 45%, transparent); }
.sheet-foot { display: flex; justify-content: space-between; gap: 8px; padding: 16px 24px 20px; border-top: 1px solid var(--sc-border); margin-top: 8px; }
@media (max-width: 759px) {
  .look { grid-template-columns: 1fr; }
  .set-row { flex-wrap: wrap; }
  .sc-select { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .lmenu, .sheet { animation: none; }
}

/* ===== Polish pass ===== */
::selection { background: color-mix(in srgb, var(--lenny-deep) 28%, transparent); }
@property --open { syntax: '<number>'; inherits: true; initial-value: 0; }

/* World atmosphere: floating pollen or fireflies, warm light by day, a soft vignette. */
#motes { position: absolute; inset: -24px; width: calc(100% + 48px); height: calc(100% + 48px); pointer-events: none; }
.w-light {
  position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
  background: radial-gradient(110% 85% at 6% -8%, rgba(255, 240, 205, .75), rgba(255, 240, 205, 0) 58%);
  opacity: calc(1 - var(--night)); transition: opacity 1.2s ease;
}
#world::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(140% 110% at 50% 42%, transparent 55%, rgba(6, 22, 30, .3) 100%);
}

/* Drag: the meadow dims around a spotlight on Lenny, and rings ripple out from him. */
#spot {
  position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0; transition: opacity .35s ease;
  background: radial-gradient(circle at var(--lx, 50%) var(--ly, 60%), transparent 0, transparent 150px, rgba(6, 16, 26, .45) 480px);
}
body.dragging #spot { opacity: 1; }
#lennyBtn::before { inset: 10% 4% 2%; border: 0; box-shadow: 0 0 0 2px rgba(255, 255, 255, .75), 0 0 24px rgba(255, 255, 255, .35); }
body.dragging #lennyBtn::before { opacity: 1; transform: none; animation: ripple 1.5s ease-out infinite; }
@keyframes ripple { from { transform: scale(.92); opacity: .95; } to { transform: scale(1.55); opacity: 0; } }

/* Lenny talks: words fade in one after another while his mouth moves. */
.say .w { display: inline-block; opacity: 0; transform: translateY(4px); filter: blur(3px); animation: wordIn .4s cubic-bezier(.2, .8, .3, 1) forwards; animation-delay: calc(var(--i) * 34ms); }
@keyframes wordIn { to { opacity: 1; transform: none; filter: blur(0); } }
.speech .sub, .speech.pop .extra { animation: fadeIn .45s cubic-bezier(.2, .8, .3, 1) both; animation-delay: calc(var(--n, 0) * 34ms + 90ms); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } }
.lenny.talk { animation: talk .14s ease-in-out infinite alternate; }
@keyframes talk { from { --open: .04; } to { --open: .34; } }
.speech { transition: opacity .6s ease; }

/* Sleep: closed eyes, slow breathing, drifting z's. */
.lenny.sleep .l-eyes-open { opacity: 0; }
.lenny.sleep .l-eyes-closed { opacity: 1; }
.lenny.sleep .l-body { animation-duration: 6.5s; }
.zz { position: fixed; z-index: 4; pointer-events: none; font: 600 17px/1 var(--font); color: #fff; text-shadow: 0 1px 8px rgba(0, 30, 40, .35); }

/* Celebrations. */
.spark {
  position: fixed; z-index: 55; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; pointer-events: none; background: var(--c, #fff);
  clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
}
.orb.done::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
  background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .8) 50%, transparent 65%) no-repeat;
  background-size: 250% 100%; animation: glint 1.3s ease-out 1 both;
}
@keyframes glint { from { background-position: 130% 0; } to { background-position: -70% 0; } }

/* Header: brand, a quiet prototype badge, and an account menu. */
header.top { padding: 6px 6px 6px 12px; }
.hdr-right { display: flex; align-items: center; gap: 6px; }
.proto {
  height: 26px; padding: 0 9px; border-radius: 6px; background: transparent; color: var(--muted);
  border: 1px dashed color-mix(in srgb, var(--muted) 55%, transparent); font: 500 11.5px/1 var(--font);
}
.proto:hover { color: var(--ink); }
.uchip {
  height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 4px; border: 0; border-radius: 10px;
  background: transparent; color: var(--ink); font: 500 13px/1 var(--font); transition: background .15s;
}
.uchip:hover, .uchip[aria-expanded="true"] { background: color-mix(in srgb, var(--sc-bg) 70%, transparent); }
.uchip svg { width: 14px; height: 14px; color: var(--muted); }
.avatar {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  font: 600 11px/1 var(--font); color: #0B2A22; letter-spacing: .02em;
  background: radial-gradient(circle at 35% 30%, var(--lb0), var(--lb1) 45%, var(--lb2));

    <div id="speech" class="speech" aria-live="polite"><p class="say"></p><div class="extra"></div></div>
    <button id="lennyBtn" type="button" aria-label="Lenny" aria-haspopup="menu" aria-expanded="false"></button>
    <span id="tummy" hidden></span>
    <span class="hint" id="hint">Drag files onto the page, or click Lenny for more</span>
  </div>
  <div id="bubbles"></div>
</main>


<input type="file" id="picker" multiple hidden>
<div id="preview" hidden></div>
<div id="toast" hidden></div>
<div id="lmenu" class="lmenu" role="menu" aria-label="Lenny" hidden></div>
<div id="umenu" class="lmenu" role="menu" aria-label="Account" hidden></div>
<div id="settings" hidden></div>
<div id="history" hidden></div>


<script>
(() => {
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
document.body.classList.add('mode-signin');
const dur = ms => RM ? 1 : ms;
const wait = ms => new Promise(r => setTimeout(r, RM ? Math.min(ms, 300) : ms));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);

const TYPES = {
  pptx: { label: 'PowerPoint', a: 'a PowerPoint', tag: 'PPTX', tc: 'var(--t-pptx)', kind: 'slide', pages: 3 },
  docx: { label: 'Word doc', a: 'a Word doc', tag: 'DOCX', tc: 'var(--t-docx)', kind: 'doc', pages: 2 },
  xlsx: { label: 'Excel sheet', a: 'an Excel sheet', tag: 'XLSX', tc: 'var(--t-xlsx)', kind: 'sheet', pages: 1 },
  pdf:  { label: 'PDF', a: 'a PDF', tag: 'PDF', tc: 'var(--t-pdf)', kind: 'doc', pages: 3 },
  txt:  { label: 'text file', a: 'a text file', tag: 'TXT', tc: 'var(--t-txt)', kind: 'doc', pages: 1 },
};
const LANGS = ['English', 'Chinese', 'Japanese', 'Korean', 'Spanish', 'French', 'German', 'Portuguese', 'Russian', 'Vietnamese', 'Thai', 'Arabic'];
const QUICK = ['English', 'Japanese', 'Chinese', 'Spanish', 'Korean', 'French'];
const BLOCK_NAMES = { page: 'the whole page', title: 'the title', b1: 'text box 1', b2: 'text box 2', b3: 'text box 3' };

const SAMPLES = [
  { name: 'Q3 销售汇报.pptx', lang: 'Chinese', pages: [['第三季度销售汇报', 'Q3 Sales Report'], ['区域业绩概览', 'Regional Performance Overview'], ['下季度计划', 'Plan for Next Quarter']] },
  { name: '業務委託契約書_2026.docx', lang: 'Japanese', pages: [['業務委託契約書', 'Service Agreement'], ['第2条 報酬及び支払', 'Article 2: Fees and Payment']] },
  { name: 'Preisliste_Ersatzteile.xlsx', lang: 'German', pages: [['Preisliste Ersatzteile 2026', 'Spare Parts Price List 2026']] },
  { name: 'manual_de_usuario.pdf', lang: 'Spanish', pages: [['Manual de usuario', 'User Manual'], ['Instalación', 'Installation'], ['Solución de problemas', 'Troubleshooting']] },
];

const S = { user: '', phase: 'greet', tummy: [], files: [], slot: 0, batch: 0, chain: Promise.resolve(), previewId: null, speech: null, dragging: false, uid: 0 };


/* ---------- World: painted meadow stills with clouds drifting in code ---------- */
const IMG_W = 2912, IMG_H = 1632, OBJ_Y = .62, BLEED = 24;
const PARALLAX = [...document.querySelectorAll('#world [data-depth]')];


// Clouds: each drifts right at its own speed and wraps around. They stay in the upper sky and
// fade out above the hills, so they never need to pass behind the land.
const CLOUDS = [
  { src: 'cloud-cumulus-2', w: .23, y: .35, v: 12, o: .95, x: .06 },
  { src: 'cloud-cumulus-1', w: .21, y: .04, v: 9, o: .92, x: .55 },
  { src: 'cloud-puffy-small-1', w: .11, y: .55, v: 16, o: .9, x: .82, day: 1 },
  { src: 'cloud-wispy-2', w: .18, y: 0, v: 20, o: .8, x: .3, day: 1 },
  { src: 'cloud-soft-distant-1', w: .16, y: .7, v: 6, o: .65, x: .68 },
];
const wc = $('#wClouds');
CLOUDS.forEach(c => {
  const img = new Image();
  img.src = `assets/${c.src}.webp`;
  img.alt = '';
  img.decoding = 'async';
  if (c.day) img.className = 'day-only';
  img.style.setProperty('--o', c.o);
  wc.append(img);
  c.el = img;
  c.xp = c.x * innerWidth;
});
let band = { top: 0, bottom: 300 };
function layoutWorld() {
  // Mirror object-fit: cover + object-position so cloud limits follow the painted horizon.
  const W = innerWidth + BLEED * 2, H = innerHeight + BLEED * 2;
  const dh = IMG_H * Math.max(W / IMG_W, H / IMG_H);
  const top = -BLEED + (H - dh) * OBJ_Y;
  const clip = top + dh * .36; // the hills never rise above ~36% of the painting
  wc.style.setProperty('--fade-start', Math.max(0, clip - dh * .1) + 'px');
  wc.style.setProperty('--fade-end', Math.max(40, clip) + 'px');
  band = { top: Math.max(8, top + dh * .02), bottom: clip - dh * .05 };
  CLOUDS.forEach(c => { c.px = Math.max(90, c.w * innerWidth); c.el.style.width = c.px + 'px'; });
}
let lastT = performance.now();
function drift(now) {
  const dt = Math.min(.1, (now - lastT) / 1000);
  lastT = now;
  const k = Math.max(.5, innerWidth / 1440);
  CLOUDS.forEach(c => {
    if (!RM) c.xp += c.v * k * dt;
    if (c.xp > innerWidth + 40) c.xp = -c.px - 40;
    const ratio = c.el.naturalWidth ? c.el.naturalHeight / c.el.naturalWidth : .6;
    const y = band.top + c.y * Math.max(0, band.bottom - band.top - c.px * ratio);
    c.el.style.transform = `translate3d(${c.xp.toFixed(1)}px, ${y.toFixed(1)}px, 0)`;
  });
  requestAnimationFrame(drift);
}
layoutWorld();
addEventListener('resize', layoutWorld);
requestAnimationFrame(drift);
const big = () => $('#lennyBtn .lenny');

function setOpen(el, v) { el && el.style.setProperty('--open', v.toFixed(2)); }
function mood(el, cls, ms) {
  if (!el || RM) return;
  el.classList.remove(cls); void el.getBBox; el.getBoundingClientRect();
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), ms);
}
function mouthCenter(el) {
  const r = el.querySelector('.l-mouth').getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

// Eyes follow the pointer, including during a native file drag (dragover carries coordinates).
let px = innerWidth / 2, py = innerHeight / 2, raf = 0;
function track(x, y) { px = x; py = y; if (!raf) raf = requestAnimationFrame(updateEyes); }
function updateEyes() {
  raf = 0;
  if (!RM) PARALLAX.forEach(g => {
    const d = +g.dataset.depth;
    g.style.transform = `translate3d(${(-(px / innerWidth - .5) * d).toFixed(1)}px, ${(-(py / innerHeight - .5) * d * .35).toFixed(1)}px, 0)`;
  });
  if (S.dragging) {
    const m = mouthCenter(big());
    setOpen(big(), Math.max(.25, Math.min(1, 1.25 - Math.hypot(px - m.x, py - m.y) / 380)));
  }
}
addEventListener('pointermove', e => track(e.clientX, e.clientY));
setInterval(() => document.querySelectorAll('.lenny').forEach(l => { if (Math.random() < .6) mood(l, 'blink', 180); }), 2600);

/* ---------- Lenny ---------- */
// Lit like a soft 3D object: light from the upper left, green bounce light from the grass below
// (moonlight at night), a glossy highlight, blurred blush and a contact shadow on the ground.
const BODY = 'M0,-80 C52,-80 88,-44 88,8 C88,58 52,84 0,84 C-52,84 -88,58 -88,8 C-88,-44 -52,-80 0,-80Z';
let lennyCount = 0;
function lennyEyes(u) {
  const eye = cx => `<g class="l-lid">
      <ellipse cx="${cx}" cy="-10" rx="11.5" ry="15.5" fill="url(#${u}e)"/>
      <ellipse cx="${cx + 3.5}" cy="-16.5" rx="4.2" ry="5.4" fill="#fff"/>
      <circle cx="${cx - 3.5}" cy="-3" r="2" fill="#fff" opacity=".75"/>
    </g>`;
  const arc = (cx, up) => `<path d="M${cx - 11},${up ? -6 : -12} Q${cx},${up ? -19 : 0} ${cx + 11},${up ? -6 : -12}" stroke="#101826" stroke-width="4.6" fill="none" stroke-linecap="round"/>`;
  return `<g class="l-eyes-open">${eye(-27)}${eye(27)}</g>
    <g class="l-eyes-happy">${arc(-27, true)}${arc(27, true)}</g>
    <g class="l-eyes-closed">${arc(-27, false)}${arc(27, false)}</g>`;
}
function lennySVG(cls) {
  const u = 'ln' + (++lennyCount);
  return `<svg class="lenny ${cls}" viewBox="-110 -126 220 232" aria-hidden="true">
    <defs>
      <radialGradient id="${u}b" cx="36%" cy="28%" r="80%">
        <stop offset="0" style="stop-color:var(--lb0)"/><stop offset=".3" style="stop-color:var(--lb1)"/>
        <stop offset=".7" style="stop-color:var(--lb2)"/><stop offset="1" style="stop-color:var(--lb3)"/>
      </radialGradient>
      <linearGradient id="${u}r" x1="0" y1="0" x2="0" y2="1">
        <stop offset=".55" style="stop-color:var(--lenny-rim)" stop-opacity="0"/>
        <stop offset="1" style="stop-color:var(--lenny-rim)" stop-opacity=".8"/>
      </linearGradient>
      <radialGradient id="${u}e" cx="38%" cy="30%" r="75%"><stop offset="0" stop-color="#34455E"/><stop offset="1" stop-color="#0B111C"/></radialGradient>
      <linearGradient id="${u}l" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#3F9E45"/><stop offset="1" stop-color="#B9EE7E"/></linearGradient>
      <radialGradient id="${u}m" cx="50%" cy="25%" r="75%"><stop offset="0" stop-color="#6A2940"/><stop offset="1" stop-color="#26101A"/></radialGradient>
      <filter id="${u}s" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.5"/></filter>
      <filter id="${u}g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
      <clipPath id="${u}c"><path d="${BODY}"/></clipPath>
    </defs>
    <ellipse class="l-shadow" cx="0" cy="90" rx="62" ry="10" fill="rgba(16, 40, 28, .32)" filter="url(#${u}s)"/>
    <g class="l-rig"><g class="l-body">
      <g class="l-sprout">
        <path d="M0,-78 C0,-90 3,-99 8,-107" stroke="#3E9E5F" stroke-width="4.5" fill="none" stroke-linecap="round"/>
        <path d="M8,-107 C20,-122 43,-117 45,-104 C32,-95 16,-97 8,-107Z" fill="url(#${u}l)"/>
        <path d="M11,-106 C23,-109 33,-107 41,-105" stroke="#fff" stroke-opacity=".4" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <path d="M6,-102 C-6,-118 -29,-116 -31,-104 C-18,-95 -5,-96 6,-102Z" fill="url(#${u}l)"/>
        <path d="M3,-102 C-9,-105 -19,-105 -27,-104" stroke="#fff" stroke-opacity=".4" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      </g>
      <path d="${BODY}" fill="url(#${u}b)"/>
      <g clip-path="url(#${u}c)">
        <ellipse cx="52" cy="46" rx="64" ry="70" style="fill:var(--lshade)" opacity=".22" filter="url(#${u}g)"/>
        <path d="${BODY}" fill="url(#${u}r)"/>
        <ellipse class="l-bulge" cx="0" cy="34" rx="22" ry="14" style="fill:var(--lb3)"/>
      </g>
      <ellipse cx="-38" cy="-44" rx="24" ry="13" fill="#fff" opacity=".55" transform="rotate(-32 -38 -44)" filter="url(#${u}s)"/>
      <ellipse cx="-46" cy="-50" rx="6.5" ry="3.6" fill="#fff" opacity=".95" transform="rotate(-32 -46 -50)"/>
      <ellipse cx="-50" cy="16" rx="13" ry="8" fill="#FF8AA5" opacity=".6" filter="url(#${u}s)"/>
      <ellipse cx="50" cy="16" rx="13" ry="8" fill="#FF8AA5" opacity=".6" filter="url(#${u}s)"/>
      <g class="l-face">
        ${lennyEyes(u)}
        <g class="l-mouth" transform="translate(0 20)">
          <path class="l-smile" d="M-10,0 Q0,9.5 10,0" stroke="#101826" stroke-width="4.2" fill="none" stroke-linecap="round"/>
          <g class="l-open"><ellipse rx="17" ry="15" fill="url(#${u}m)"/><ellipse cy="8" rx="10" ry="5.5" fill="#FF7C93"/></g>
        </g>
      </g>
    </g></g>
  </svg>`;
}

// Springs: the face looks toward the pointer (or dragged file) and the body leans a little,
// both easing in with a damped spring so the motion feels alive rather than mechanical.
const rigs = new WeakMap();
let rigT = performance.now();
function rigLoop(now) {
  const dt = Math.min(.05, (now - rigT) / 1000);
  rigT = now;
  document.querySelectorAll('.lenny').forEach(svg => {
    const r = svg.getBoundingClientRect();
    if (!r.width) return;
    let st = rigs.get(svg);
    if (!st) { st = { fx: 0, fy: 0, vx: 0, vy: 0, lean: 0, vl: 0 }; rigs.set(svg, st); }
    const dx = px - (r.left + r.width / 2), dy = py - (r.top + r.height * .45);
    const d = Math.hypot(dx, dy) || 1, reach = Math.min(1, d / (r.width * 1.1));
    const on = S.set.follow;
    const tx = on ? dx / d * 9 * reach : 0, ty = on ? dy / d * 6.5 * reach : 0;
    const eager = S.dragging && svg === big();
    const tl = on ? Math.max(-1, Math.min(1, dx / (r.width * 2))) * (eager ? 9 : 3) : 0;
    st.vx += (150 * (tx - st.fx) - 19 * st.vx) * dt; st.fx += st.vx * dt;
    st.vy += (150 * (ty - st.fy) - 19 * st.vy) * dt; st.fy += st.vy * dt;
    st.vl += (80 * (tl - st.lean) - 13 * st.vl) * dt; st.lean += st.vl * dt;
    svg.querySelector('.l-face').setAttribute('transform', `translate(${st.fx.toFixed(2)} ${st.fy.toFixed(2)})`);
    svg.querySelector('.l-rig').setAttribute('transform', `rotate(${st.lean.toFixed(2)} 0 84)`);
  });
  requestAnimationFrame(rigLoop);
}
if (!RM) requestAnimationFrame(rigLoop);
function cheer(el, ms = 1000) { if (S.set.playful) mood(el, 'hop', ms); mood(el, 'happy', ms + 150); }
$('#lennyBtn').innerHTML = lennySVG('big');
/* ---------- Settings (saved in this browser; the real app would keep them on the user's profile) ---------- */
const DEFAULTS = { hue: 162, sprout: true, lang: '', follow: true, playful: true, theme: 'system' };
const SWATCHES = [['Mint', 162], ['Sky', 205], ['Lilac', 262], ['Rose', 340], ['Peach', 22], ['Sunny', 45]];
S.set = { ...DEFAULTS };
try { Object.assign(S.set, JSON.parse(localStorage.getItem('lenny.settings') || '{}')); } catch {}
function saveSettings() { try { localStorage.setItem('lenny.settings', JSON.stringify(S.set)); } catch {} }
function applySettings() {
  const h = S.set.hue, r = document.documentElement.style;
  r.setProperty('--lb0', `hsl(${h} 90% 95%)`);
  r.setProperty('--lb1', `hsl(${h} 62% 78%)`);
  r.setProperty('--lb2', `hsl(${h} 46% 54%)`);
  r.setProperty('--lb3', `hsl(${h} 54% 35%)`);
  r.setProperty('--lshade', `hsl(${h} 58% 26%)`);
  r.setProperty('--lenny-deep', `hsl(${h} 54% 38%)`);
  document.body.classList.toggle('no-sprout', !S.set.sprout);
}
applySettings();

function boop(el) {
  if (!el) return;
  mood(el, 'boop', 540);
  mood(el, 'happy', 800);
}

/* ---------- Lenny's menu ---------- */
const ICON = {
  upload: '<path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>',
  sparkles: '<path d="M9.94 14.06 4 20"/><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/>',
  languages: '<path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/>',
  download: '<path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/>',
  rotate: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  settings: '<path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>',
};
const ico = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;
const BOOPS = ['Hehe, that tickles!', 'Boop! Hi there.', 'You rang?', 'At your service!'];
const menu = $('#lmenu');
function openMenu() {
  const done = bubbles().filter(f => f.status === 'done').length;
  const items = [
    ['pick', 'upload', 'Upload files'],
    ['samples', 'sparkles', 'Try sample files'],
    S.tummy.length && S.phase === 'collect' ? ['done', 'languages', S.set.lang ? `Translate to ${S.set.lang}` : 'Translate what I ate'] : null,
    done ? ['download-all', 'download', `Download ${done === 1 ? '1 file' : done + ' files'}`] : null,
    done ? ['clear-done', 'x', 'Clear finished bubbles'] : null,
    ['history', 'history', 'Your files'],
    bubbles().length || S.tummy.length ? ['restart', 'rotate', 'Start over'] : null,
  ].filter(Boolean);
  menu.innerHTML = `<div class="m-head"><b>${BOOPS[Math.floor(Math.random() * BOOPS.length)]}</b><span>${S.set.lang ? `Translating to ${esc(S.set.lang)} by default` : 'What should we do?'}</span></div>`
    + items.map(([act, ic, label]) => `<button class="mi" type="button" role="menuitem" data-act="${act}">${ico(ic)}${esc(label)}</button>`).join('')
    + `<hr><button class="mi" type="button" role="menuitem" data-act="settings">${ico('settings')}Lenny settings</button>`;
  menu.hidden = false;
  placeMenu();
  $('#lennyBtn').setAttribute('aria-expanded', 'true');
  menu.querySelector('.mi').focus();
}
function placeMenu() {
  const r = $('#lennyBtn').getBoundingClientRect(), mw = menu.offsetWidth, mh = menu.offsetHeight;
  let x, y, origin;
  if (r.right + 4 + mw < innerWidth - 12) { x = r.right - r.width * .06; y = r.top + r.height * .18; origin = 'left top'; }
  else if (r.left - mw > 12) { x = r.left + r.width * .06 - mw; y = r.top + r.height * .18; origin = 'right top'; }
  else { x = (innerWidth - mw) / 2; y = r.bottom + 6; origin = 'center top'; }
  menu.style.left = Math.max(12, x) + 'px';
  menu.style.top = Math.max(12, Math.min(innerHeight - mh - 12, y)) + 'px';
  menu.style.setProperty('--origin', origin);
}
function closeMenu(refocus) {
  if (!umenu.hidden) {
    umenu.hidden = true;
    $('#uchip').setAttribute('aria-expanded', 'false');
    if (refocus) $('#uchip').focus();
  }
  if (menu.hidden) return;
  menu.hidden = true;
  $('#lennyBtn').setAttribute('aria-expanded', 'false');
  if (refocus) $('#lennyBtn').focus();
}
function menuKeys(e) {
  const items = [...e.currentTarget.querySelectorAll('.mi')], i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
  } else if (e.key === 'Home' || e.key === 'End') {
    e.preventDefault();
    items[e.key === 'Home' ? 0 : items.length - 1].focus();
  } else if (e.key === 'Tab') closeMenu(false);
}
menu.addEventListener('keydown', menuKeys);
addEventListener('resize', () => { if (!menu.hidden) placeMenu(); });

/* ---------- Settings dialog ---------- */
const sheetEl = $('#settings');
function settingsHTML() {
  const sw = (key, label) => `<button class="switch" type="button" role="switch" data-set="${key}" aria-checked="${S.set[key]}" aria-label="${label}"></button>`;
  return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="set-title">
    <div class="sheet-head"><h2 id="set-title">Lenny settings</h2><p>Make Lenny yours. Changes save automatically in this browser.</p></div>
    <div class="sheet-body">
      <section class="set-group"><h3>Look</h3>
        <div class="look">
          <div class="look-stage">${lennySVG('preview')}</div>
          <div class="look-ctl">
            <div class="swatches" role="radiogroup" aria-label="Lenny's color">
              ${SWATCHES.map(([n, h]) => `<label class="sw" title="${n}"><input type="radio" name="lhue" value="${h}" aria-label="${n}"${S.set.hue === h ? ' checked' : ''}><span style="--c:hsl(${h} 50% 58%)"></span></label>`).join('')}
            </div>
            <label class="hue-l" for="hue">Or pick any color</label>
            <input class="hue" id="hue" type="range" min="0" max="359" value="${S.set.hue}">
            <div class="set-row compact"><div><b>Sprout</b></div>${sw('sprout', 'Sprout')}</div>
          </div>
        </div>
      </section>
      <section class="set-group"><h3>Theme</h3>
        <div class="set-row">
          <div><b>Meadow</b><span>Day or night. System follows your computer.</span></div>
          <div class="seg" role="group" aria-label="Theme">
            ${[['system', 'System'], ['light', 'Day'], ['dark', 'Night']].map(([v, l]) => `<button type="button" data-theme-opt="${v}" aria-pressed="${S.set.theme === v}">${l}</button>`).join('')}
          </div>
        </div>
      </section>
      <section class="set-group"><h3>Translation</h3>
        <div class="set-row">
          <div><b>Default language</b><span>Lenny skips the question and translates to this.</span></div>
          <select class="sc-select" id="deflang" aria-label="Default language">
            <option value="">Ask me every time</option>
            ${LANGS.map(l => `<option${S.set.lang === l ? ' selected' : ''}>${l}</option>`).join('')}
          </select>
        </div>
      </section>
      <section class="set-group"><h3>Behavior</h3>
        <div class="set-row"><div><b>Follow my cursor</b><span>Lenny watches your pointer and anything you drag.</span></div>${sw('follow', 'Follow my cursor')}</div>
        <div class="set-row"><div><b>Playful reactions</b><span>Hops and cheers when files finish.</span></div>${sw('playful', 'Playful reactions')}</div>
      </section>
    </div>

const motes = $('#motes'), mctx = motes.getContext('2d');
let MW = 0, MH = 0, DPR = 1, nightAmt = 0;
const newMote = anywhere => ({
  x: Math.random() * MW, y: anywhere ? Math.random() * MH : MH + 10, r: .8 + Math.random() * 2.2,
  vx: 4 + Math.random() * 10, vy: -(3 + Math.random() * 8), ph: Math.random() * 6.283, sp: .6 + Math.random() * 1.2,
  low: .56 + Math.random() * .4,
});
function sizeMotes() {
  DPR = Math.min(2, devicePixelRatio || 1);

  motes.width = MW * DPR; motes.height = MH * DPR;
}
sizeMotes();
const parts = Array.from({ length: 46 }, () => newMote(true));
addEventListener('resize', sizeMotes);
const readNight = () => { nightAmt = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--night')) || 0; };
readNight();
setInterval(readNight, 1000);
let moteT = performance.now();
function drawMotes(now) {
  const dt = Math.min(.05, (now - moteT) / 1000);
  moteT = now;
  mctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  mctx.clearRect(0, 0, MW, MH);
  const night = nightAmt > .5;
  parts.forEach((p, i) => {
    p.ph += dt * p.sp;
    if (night) {
      if (i >= 30) return;
      p.x += p.vx * .12 * dt;
      if (p.x > MW + 40) p.x = -40;
      const x = p.x + Math.sin(p.ph * .6) * 30, y = MH * p.low + Math.sin(p.ph * .9) * 18;
      const a = Math.max(0, Math.sin(p.ph * 1.4)) ** 2, R = p.r * 7;
      const g = mctx.createRadialGradient(x, y, 0, x, y, R);
      g.addColorStop(0, `rgba(240, 255, 170, ${(.95 * a).toFixed(3)})`);
      g.addColorStop(.22, `rgba(215, 250, 120, ${(.45 * a).toFixed(3)})`);
      g.addColorStop(1, 'rgba(200, 240, 100, 0)');
      mctx.fillStyle = g;
      mctx.beginPath(); mctx.arc(x, y, R, 0, 6.283); mctx.fill();
    } else {
      p.x += (p.vx + Math.sin(p.ph) * 6) * dt;
      p.y += (p.vy + Math.cos(p.ph * .8) * 4) * dt;
      if (p.x > MW + 10 || p.y < -10) Object.assign(p, newMote(false));
      const a = .3 + .35 * Math.sin(p.ph * 1.7), R = p.r * 2.2;
      const g = mctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
      g.addColorStop(0, `rgba(255, 252, 236, ${Math.max(0, a).toFixed(3)})`);
      g.addColorStop(1, 'rgba(255, 252, 236, 0)');
      mctx.fillStyle = g;
      mctx.beginPath(); mctx.arc(p.x, p.y, R, 0, 6.283); mctx.fill();

}

      { transform: `translate(${Math.cos(a) * d * 1.25}px, ${Math.sin(a) * d * 1.25 + 12}px) scale(0) rotate(200deg)`, opacity: 0 },

    const t = i / n;

      transform: `translate(${(dx * t).toFixed(1)}px, ${(dy * t - lift * 4 * t * (1 - t)).toFixed(1)}px) scale(${(1 + (endScale - 1) * t * t).toFixed(3)}) rotate(${(endRot * t).toFixed(1)}deg)`,

}

    f.push({ transform: `translate(${(ox * (1 - t)).toFixed(1)}px, ${(oy * (1 - t) - lift * 4 * t * (1 - t)).toFixed(1)}px) scale(${(.08 + 1.04 * t).toFixed(3)})`, opacity: Math.min(1, .3 + t * 2), offset: t * .8 });
